name: Build Windows EXE

on:
  push:
    branches: ["**"]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Electron tooling
        run: npm install --save-dev electron @electron/packager

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          npm version $ver --no-git-tag-version --allow-same-version

      - name: Package Windows app
        run: npm run electron:package

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build single-file installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe", "C:\Program Files\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          & $iscc.FullName "/DAppVersion=$ver" electron\installer.iss
          Copy-Item electron-release\USB-DJ-Bridge-Setup.exe USB-DJ-Bridge-Setup.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: USB-DJ-Bridge-Setup
          path: USB-DJ-Bridge-Setup.exe

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: USB-DJ-Bridge-Setup.exe
