name: Build Windows EXE

on:
  push:
    branches: ["**"]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Electron tooling
        run: npm install --save-dev electron @electron/packager

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          npm version $ver --no-git-tag-version --allow-same-version

      - name: Select release for a new package version
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref.startsWith('refs/tags/')) {
              core.setOutput('tag', context.ref.slice('refs/tags/'.length));
              return;
            }
            if (context.ref !== 'refs/heads/main' || context.eventName !== 'push') return;
            const version = require('./package.json').version;
            const tag = `v${version}`;
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('tag', tag);
            }

      - name: Package Windows app
        run: npm run electron:package

      - name: Verify offline logo is bundled
        shell: pwsh
        run: |
          $scripts = Get-ChildItem dist-electron\assets\*.js
          $embedded = $scripts | Select-String -SimpleMatch "data:image/png;base64,"
          if (-not $embedded) { throw "Desktop logo was not bundled for offline use" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build single-file installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe", "C:\Program Files\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          & $iscc.FullName "/DAppVersion=$ver" electron\installer.iss
          Copy-Item electron-release\USB-DJ-Bridge-Setup.exe USB-DJ-Bridge-Setup.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: USB-DJ-Bridge-Setup
          path: USB-DJ-Bridge-Setup.exe

      - name: Publish versioned GitHub Release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: USB DJ Bridge ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: USB-DJ-Bridge-Setup.exe
