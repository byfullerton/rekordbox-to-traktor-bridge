name: Build Windows EXE

on:
  push:
    branches: ["**"]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Electron tooling
        run: npm install --save-dev electron @electron/packager

      - name: Package Windows app
        run: npm run electron:package

      - name: Zip the app folder
        shell: pwsh
        run: Compress-Archive -Path electron-release/USB-NML-win32-x64 -DestinationPath USB-NML-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: USB-NML-Windows
          path: USB-NML-Windows.zip

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: USB-NML-Windows.zip
